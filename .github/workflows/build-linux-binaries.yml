name: Build Linux Binaries

on:
  push:
    branches: [main, master]
    paths: ['Dockerfile', '.github/workflows/build-linux-binaries.yml']
  workflow_run:
    workflows: ['Build Environment Image']
    types: [completed]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: binmgr/icecast

jobs:
  build:
    name: Build (${{ matrix.arch }})
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'master'
          )
        )
      }}
    permissions:
      packages: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Icecast
        run: |
          mkdir -p "${RUNNER_TEMP}/icecast-output"
          docker run --rm \
            --platform="linux/${{ matrix.arch }}" \
            -v "${RUNNER_TEMP}/icecast-output:/output" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build \
            build-icecast ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: icecast-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/icecast-output/icecast-linux-${{ matrix.arch }}
            ${{ runner.temp }}/icecast-output/VERSION

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: ver
        run: echo "version=$(cat artifacts/VERSION 2>/dev/null || echo '2.5.0')" >> $GITHUB_OUTPUT

      - name: Get YYMM tag
        id: yymm
        run: echo "tag=$(date -u +'%y%m')" >> $GITHUB_OUTPUT

      - name: Prepare release
        run: |
          mkdir release && cp artifacts/icecast-* release/
          chmod +x release/icecast-linux-* && cd release && sha256sum icecast-linux-* > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ steps.ver.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${{ steps.ver.outputs.version }}" --title "Icecast ${{ steps.ver.outputs.version }}" \
            --notes "Static Icecast binaries" release/*

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: cp release/icecast-linux-* .
      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.yymm.outputs.tag }}
