name: Build Linux Binaries

on:
  push:
    branches: [main, master]
    paths: ['docker/Dockerfile.runtime']
  schedule:
    - cron: '0 0 1 * *'
  workflow_run:
    workflows: ['Build Environment Image']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: binmgr/icecast

jobs:
  build:
    name: Build (${{ matrix.arch }})
    if: >-
      ${{
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          (
            github.event.workflow_run.head_branch == 'main' ||
            github.event.workflow_run.head_branch == 'master'
          )
        )
      }}
    permissions:
      packages: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0
        with:
          platforms: amd64,arm64
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build Icecast
        run: |
          mkdir -p "${RUNNER_TEMP}/icecast-output"
          docker run --rm \
            --platform="linux/${{ matrix.arch }}" \
            -v "${RUNNER_TEMP}/icecast-output:/output" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:build \
            build-icecast ${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: icecast-linux-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/icecast-output/icecast-linux-${{ matrix.arch }}
            ${{ runner.temp }}/icecast-output/VERSION
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Get version
        id: ver
        run: echo "version=$(cat artifacts/VERSION 2>/dev/null || echo '2.5.0')" >> $GITHUB_OUTPUT

      - name: Get YYMM tag
        id: yymm
        run: echo "tag=$(date -u +'%y%m')" >> $GITHUB_OUTPUT

      - name: Get build date
        id: date
        run: echo "value=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Verify binaries
        run: |
          chmod +x artifacts/icecast-linux-amd64 artifacts/icecast-linux-arm64
          file artifacts/icecast-linux-amd64 | grep -Eq 'statically linked|static-pie linked'
          file artifacts/icecast-linux-arm64 | grep -Eq 'statically linked|static-pie linked'
          artifacts/icecast-linux-amd64 --version

      - name: Prepare release
        run: |
          mkdir release && cp artifacts/icecast-* release/
          chmod +x release/icecast-linux-* && cd release && sha256sum icecast-linux-* > SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "v${{ steps.ver.outputs.version }}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "v${{ steps.ver.outputs.version }}" --title "Icecast ${{ steps.ver.outputs.version }}" \
            --notes "Static Icecast binaries for Linux amd64 and arm64" release/*

      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - run: cp release/icecast-linux-* .
      - uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: docker/Dockerfile.runtime
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            BUILD_DATE=${{ steps.date.outputs.value }}
            VCS_REF=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.yymm.outputs.tag }}
