name: Build Environment Image

on:
  push:
    branches: [main, master]
    paths:
      - 'docker/Dockerfile.build'
      - '.gitea/workflows/build-env-image.yml'
  schedule:
    - cron: '0 0 1 */3 *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0
        with:
          platforms: amd64,arm64
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0
      - name: Build amd64 environment image
        run: docker buildx build --platform linux/amd64 --load -t local/icecast:build-amd64 -f docker/Dockerfile.build .
      - name: Build arm64 environment image
        run: docker buildx build --platform linux/arm64 --load -t local/icecast:build-arm64 -f docker/Dockerfile.build .
